<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Cinemap IDF</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>

<div id="header">
  <div class="logo">🎬 Cine<em>map</em></div>
  <div class="sep"></div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search-input" type="text" placeholder="Film, cinéma…" autocomplete="off" spellcheck="false" />
    <div id="search-dropdown"></div>
  </div>

  <div class="filters">
    <div class="select-wrap">
      <select id="dept-filter">
        <option value="">Toute l'IDF</option>
      </select>
    </div>

    <div class="date-picker">
      <button class="dp-pill active" data-offset="0" type="button">Auj.</button>
      <div class="dp-sep"></div>
      <input type="date" class="dp-input" id="date-filter" />
    </div>

    <button class="aae-btn" id="aae-btn" type="button"
            title="Cinémas labellisés Art &amp; Essai par le CNC">
      <span class="aae-dot"></span>Art &amp; Essai
    </button>

    <span class="badge"><strong id="cinema-count">—</strong> cinémas</span>
    <button class="theme-btn" id="theme-btn" type="button">🌙</button>
  </div>
</div>

<div id="body-wrap">
  <div id="map">
    <div id="filter-bar">
      <span class="fb-label">Film :</span>
      <span class="fb-title" id="fb-title"></span>
      <span class="fb-count" id="fb-count"></span>
      <button class="fb-reset" id="fb-reset" type="button">✕ Réinitialiser</button>
    </div>
  </div>

  <div id="panel">
    <div class="ph">
      <button class="close-btn" id="close-panel" type="button">✕</button>
      <h2 id="panel-name">—</h2>
      <div class="ph-meta" id="panel-meta"></div>
    </div>
    <div class="date-nav">
      <button id="prev-day" type="button">‹</button>
      <span id="panel-date-label">—</span>
      <button id="next-day" type="button">›</button>
    </div>
    <div id="welcome"></div>
    <div class="panel-body" id="panel-body" style="display:none"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
