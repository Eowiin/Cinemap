# /etc/nginx/sites-available/cinemap, lien dans sites-enabled.
# Version HTTP seulement : `certbot --nginx -d cinemap.ethansaux.fr` ajoute ensuite
# le bloc 443 et la redirection HTTP → HTTPS dans le fichier installé (voir docs/DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name cinemap.ethansaux.fr;

    # Le front de la release active (lien symbolique basculé par deploy/activate.sh).
    root /opt/cinemap/current/www;
    index index.html;

    # Ubuntu n'active gzip que pour text/html ; l'API, elle, compresse elle-même.
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_vary on;

    location /api/ {
        # Port de BIND_ADDR (/etc/cinemap/cinemap.env).
        proxy_pass http://127.0.0.1:11174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers de Vite avec un hash dans le nom : ils ne changent jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tout le reste (index.html, sw.js, manifeste, icônes) : revalidé à chaque fois,
    # sinon une nouvelle version du service worker mettrait des heures à arriver.
    # Chemin inconnu (/film/123, /cinema/C0013) → index.html, le routeur du front s'en charge.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
